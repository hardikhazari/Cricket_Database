<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CricPulse - Sign Up</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
        background-color: #121212;
        color: #ffffff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .auth-container {
        background-color: #1e1e1e;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }

      .auth-container h2 {
        color: rgb(219, 198, 64);
        margin-bottom: 20px;
      }

      .auth-container input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #333;
        border-radius: 5px;
        background-color: #2a2a2a;
        color: white;
        box-sizing: border-box;
      }

      .auth-container button {
        width: 100%;
        padding: 12px;
        background-color: rgb(219, 198, 64);
        color: #121212;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 15px;
        transition: background-color 0.3s;
      }

      .google-btn {
        background-color: #ffffff !important;
        color: #757575 !important;
        border: 1px solid #ddd !important;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .google-btn:hover {
        background-color: #f1f1f1 !important;
      }

      .auth-container button:hover {
        background-color: #c9b439;
      }

      .auth-container p {
        margin-top: 20px;
        font-size: 14px;
      }

      .auth-container a {
        color: rgb(219, 198, 64);
        text-decoration: none;
      }

      .auth-container a:hover {
        text-decoration: underline;
      }

      .error-message {
        color: #ff4c4c;
        font-size: 14px;
        margin-top: 10px;
        display: none;
      }

      .success-message {
        color: #4cff4c;
        font-size: 14px;
        margin-top: 10px;
        display: none;
      }

      .google-auth-wrapper {
        margin-top: 15px;
        display: flex;
        justify-content: center;
      }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <header>
      <div class="logo">
        <h1>CricPulse</h1>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="series.html">Series</a></li>
          <li><a href="teams.html">Teams</a></li>
          <li><a href="rankings.html">Rankings</a></li>
          <li><a href="profile.html">Profile</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="auth-container">
        <h2>Create Account</h2>
        <form id="signup-form">
          <input type="email" id="email" placeholder="Email Address" required />
          <input type="text" id="username" placeholder="Username" required />
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
          <button type="submit">Sign Up</button>
        </form>
        <div
          id="g_id_onload"
          data-client_id="766821786059-4kt0s8ctjg6v2lviho0pvcs07v76f5pf.apps.googleusercontent.com"
          data-context="signup"
          data-ux_mode="popup"
          data-callback="handleCredentialResponse"
          data-auto_prompt="false"
        ></div>
        <div class="google-auth-wrapper">
          <div
            class="g_id_signin"
            data-type="standard"
            data-shape="rectangular"
            data-theme="outline"
            data-text="signup_with"
            data-size="large"
            data-logo_alignment="left"
          ></div>
        </div>
        <p id="error-message" class="error-message"></p>
        <p id="success-message" class="success-message"></p>
        <p>Already have an account? <a href="login.html">Login here</a></p>
      </div>
    </main>

    <footer>
      <p>© 2026 CricPulse - All Rights Reserved</p>
    </footer>

    <script>
      document
        .getElementById("signup-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;
          const errorElement = document.getElementById("error-message");
          const successElement = document.getElementById("success-message");

          errorElement.style.display = "none";
          successElement.style.display = "none";

          try {
            const response = await fetch("http://localhost:3000/signup", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, username, password }),
            });

            const data = await response.json();

            if (response.ok) {
              successElement.textContent =
                "Account created successfully! Redirecting to login...";
              successElement.style.display = "block";
              setTimeout(() => {
                window.location.href = "login.html";
              }, 2000);
            } else {
              errorElement.textContent = data.message || "Signup failed";
              errorElement.style.display = "block";
            }
          } catch (err) {
            errorElement.textContent = "Error connecting to server";
            errorElement.style.display = "block";
          }
        });

      // Real Google Signup - sends raw token to backend for secure verification
      async function handleCredentialResponse(response) {
        const errorElement = document.getElementById("error-message");
        const token = response.credential;

        try {
          const res = await fetch("http://localhost:3000/google-login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: token }),
          });

          const data = await res.json();

          if (res.ok) {
            localStorage.setItem("username", data.name);
            localStorage.setItem("email", data.email);
            window.location.href = "profile.html";
          } else {
            errorElement.textContent = data.message || "Google Sign Up failed";
            errorElement.style.display = "block";
          }
        } catch (err) {
          errorElement.textContent = "Error connecting to server";
          errorElement.style.display = "block";
        }
      }
    </script>
  </body>
</html>
